# data_visuals 全局路径配置
# ============================

project:
  name: data_visuals
  root: .             # 相对于此配置文件，即项目根目录
  version: "0.1.0"

paths:
  # 包核心目录
  package: data_visuals

  # 子模块
  core: data_visuals/core
  data: data_visuals/data
  compute: data_visuals/compute
  layout: data_visuals/layout
  charts: data_visuals/charts
  renderer: data_visuals/renderer
  themes: data_visuals/themes
  utils: data_visuals/utils

  # 资源目录
  schemas: schemas
  presets: presets
  templates: templates
  frontend: frontend
  examples: examples
  tests: tests

  # 数据 & 输出
  data_dir: data          # 输入 CSV 数据存放
  output_dir: output      # 输出 SVG / PDF / PNG

# 默认导出设置
export:
  default_format: svg
  dpi: 300
  embed_fonts: true

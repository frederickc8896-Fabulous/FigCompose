name: Publish to PyPI

on:
  push:
    tags: ["v*"]

# Building the package cannot request a publishing identity.
permissions: {}

concurrency:
  group: pypi-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the version tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Verify the release version
        id: version
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          version = project["version"]
          expected_tag = f"v{version}"
          if project["name"] != "FigCompose":
              raise SystemExit("The distribution name must be FigCompose.")
          if os.environ["GITHUB_REF_TYPE"] != "tag":
              raise SystemExit("Publishing requires a version tag.")
          if os.environ["GITHUB_REF_NAME"] != expected_tag:
              raise SystemExit(f"The version tag must be exactly {expected_tag}.")

          module = ast.parse(Path("data_visuals/__init__.py").read_text(encoding="utf-8"))
          runtime_versions = [
              ast.literal_eval(node.value)
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__"
                      for target in node.targets)
          ]
          if runtime_versions != [version]:
              raise SystemExit("data_visuals.__version__ must match pyproject.toml.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          print(f"Verified FigCompose {version} ({expected_tag}).")
          PY

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      # The default build creates an sdist, then builds the wheel from that sdist.
      - name: Build source and wheel distributions
        run: python -m build

      - name: Check package metadata and README rendering
        run: python -m twine check --strict dist/*

      - name: Install the built wheel and dependencies
        run: python -m pip install dist/*.whl

      - name: Verify the installed package outside the checkout
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          MPLBACKEND: Agg
        run: |
          cd "$RUNNER_TEMP"
          python -I - <<'PY'
          import ast
          from importlib import metadata, resources
          import json
          import os
          from pathlib import Path
          import tempfile

          import numpy as np
          import pandas as pd
          import data_visuals
          from data_visuals import FigureConfig, plot
          from data_visuals.core import Figure, PanelResult
          from data_visuals.themes import load_theme

          checkout = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          installed = Path(data_visuals.__file__).resolve()
          assert not installed.is_relative_to(checkout), installed
          assert metadata.version("FigCompose") == os.environ["EXPECTED_VERSION"]
          assert data_visuals.__version__ == os.environ["EXPECTED_VERSION"]
          for theme in ("general", "modern"):
              content = resources.files("data_visuals.themes").joinpath(f"{theme}.json")
              assert json.loads(content.read_text(encoding="utf-8"))["name"] == theme
              assert load_theme(theme)["name"] == theme

          # Use an available Matplotlib font; Times New Roman is not bundled.
          config = FigureConfig(font_family="DejaVu Serif")
          figure = plot(
              pd.DataFrame({"epoch": [1, 2, 3], "score": [0.70, 0.81, 0.87]}),
              x="epoch",
              plots=[{"kind": "line", "metric": "score",
                      "chart_opts": {"xticks": [1, 2, 3], "yformat": ".2f"}}],
              canvas={"width": 90}, config=config,
              style="modern", palette="curated-5-warm",
              title="FigCompose smoke test",
          )
          with tempfile.TemporaryDirectory(prefix="figcompose-smoke-") as directory:
              destination = Path(directory)
              figure.render(str(destination / "figure.pdf"))
              figure.render(str(destination / "figure.png"), dpi=300)
              assert (destination / "figure.pdf").read_bytes().startswith(b"%PDF-")
              assert (destination / "figure.png").read_bytes().startswith(b"\x89PNG\r\n\x1a\n")
              report = figure.check()
              print(report.summary())
              report.raise_for_errors(include_warnings=True)

              # Reuse only the public gallery's two function definitions. Do not
              # execute its checkout import or sys.path manipulation.
              gallery_source = checkout / "assets" / "readme" / "generate.py"
              source = ast.parse(gallery_source.read_text(encoding="utf-8"))
              definitions = [
                  node for node in source.body
                  if isinstance(node, ast.FunctionDef)
                  and node.name in {"gallery_data", "build_gallery"}
              ]
              assert {node.name for node in definitions} == {"gallery_data", "build_gallery"}

              def installed_plot(*args, **kwargs):
                  kwargs.setdefault("config", config)
                  return plot(*args, **kwargs)

              namespace = {
                  "np": np, "pd": pd, "METHODS": ("Method A", "Method B"),
                  "plot": installed_plot,
              }
              exec(compile(ast.Module(body=definitions, type_ignores=[]),
                           str(gallery_source), "exec"), namespace)
              gallery = namespace["build_gallery"]()
              gallery.render(str(destination / "gallery.pdf"))
              gallery.render(str(destination / "gallery.png"), dpi=150)
              assert (destination / "gallery.pdf").read_bytes().startswith(b"%PDF-")
              assert (destination / "gallery.png").read_bytes().startswith(b"\x89PNG\r\n\x1a\n")
              gallery_report = gallery.check()
              print("Nine native chart kinds:", gallery_report.summary())
              gallery_report.raise_for_errors()

              # The README gallery contains donut; check pie as the tenth kind.
              pie = installed_plot(
                  pd.DataFrame({"method": ["Method A", "Method B"], "count": [58, 42]}),
                  group="method", plots=[{"kind": "pie", "metric": "count"}],
                  canvas={"width": 90}, style="modern", palette="curated-2-default",
                  title="Composition", legend={"scope": "shared", "ncols": 2},
              )
              pie.render(str(destination / "pie.pdf"))
              pie.render(str(destination / "pie.png"), dpi=150)
              pie_report = pie.check()
              print("Pie:", pie_report.summary())
              pie_report.raise_for_errors()

              def draw_custom(ax, context):
                  text_style = context.text_kwargs()
                  text_style["fontsize"] = 8
                  text = ax.text(0.5, 0.5, "Encoder", ha="center", va="center", **text_style)
                  return PanelResult(artists=[text])

              custom = Figure(rows=1, cols=1, canvas={"width": 90},
                              config=config, title="Custom panel", legend=False)
              custom[0, 0].custom(draw_custom, min_size=(100, 50), preferred_aspect=2)
              custom.render(str(destination / "custom.svg"))
              assert "<svg" in (destination / "custom.svg").read_text(encoding="utf-8")
              custom_report = custom.check()
              print("Data-free custom panel:", custom_report.summary())
              custom_report.raise_for_errors()
          print(f"Installed package verified: {installed}")
          PY

      - name: Store verified distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish verified distributions
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/FigCompose/${{ needs.build.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
          digest-mismatch: error

      # PyPI must trust this repository, publish.yml, and the pypi environment.
      # No long-lived PyPI token or GitHub Actions secret is needed.
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

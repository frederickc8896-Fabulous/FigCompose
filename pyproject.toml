[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "FigCompose"
version = "0.1.0"
description = "FigCompose — rule-driven publication-quality visualization engine for researchers"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "FigCompose contributors"}]
keywords = ["visualization", "matplotlib", "research", "paper", "publication"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.23.5",
    "cycler>=0.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/frederickc8896-Fabulous/FigCompose"
Repository = "https://github.com/frederickc8896-Fabulous/FigCompose"
Issues = "https://github.com/frederickc8896-Fabulous/FigCompose/issues"

[tool.setuptools.packages.find]
include = ["data_visuals", "data_visuals.*"]

[tool.setuptools.package-data]
data_visuals = ["themes/*.json"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
